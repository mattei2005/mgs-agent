    <div id="app">
      <!-- Static splash shown until Vue mounts; mirrors src/components/Loading.vue -->
      <style>
        .splash {
          display: flex;
          align-items: flex-end;
          justify-content: center;
          gap: 3px;
          height: 36px;
          margin-top: 45vh;
        }
        .splash span {
          width: 14px;
          height: 14px;
          border-radius: 50%;
          animation: splash-bounce 1.5s ease-in-out infinite;
        }
        @keyframes splash-bounce {
          0%,
          20%,
          100% {
            transform: translateY(0);
          }
          10% {
            transform: translateY(-14px);
          }
        }
      </style>
      <div class="splash">
        <span style="background: #2196f3"></span>
        <span style="background: #1565c0; animation-delay: 0.3s"></span>
        <span style="background: #42a5f5; animation-delay: 0.6s"></span>
        <span style="background: #1e88e5; animation-delay: 0.9s"></span>
        <span style="background: #42a5f5; animation-delay: 1.2s"></span>
      </div>
    </div>
