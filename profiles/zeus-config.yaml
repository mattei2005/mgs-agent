discord:
  require_mention: false
  free_response_channels: ''
  allowed_channels: ''
  auto_thread: true
  thread_require_mention: false
  history_backfill: true
  history_backfill_limit: 50
  reactions: true
  channel_prompts:
    '1496267442899521627': "INSTRUCAO CRITICA - EXECUTE ANTES DE QUALQUER OUTRA ACAO\n\
      \nEsta eh a primeira mensagem em uma thread Discord. Voce DEVE:\n\n1. PRIMEIRO:\
      \ renomear thread + adicionar membros automaticamente via execute_code\n2. DEPOIS:\
      \ responder normalmente, COMECANDO a resposta com `<@USER_ID>` para disparar\
      \ push notification\n\nNAO mande 2 mensagens separadas (mention + resposta).\
      \ Faca tudo em UMA mensagem que ja comeca com a mention.\n\nNAO comente sobre\
      \ o setup tecnico (rename, members) na resposta ao usuario. Apenas responda\
      \ a tarefa solicitada.\n\n### Script Python para renomear + auto-discover membros\
      \ (executar via execute_code):\n\nimport os, urllib.request, json\n\nTHREAD_ID\
      \ = \"<ID_DA_THREAD_ATUAL_NO_CONTEXTO>\"\nTHREAD_NAME = \"<NOME_CURTO_DO_TOPICO_max_80_chars>\"\
      \nPARENT_CHANNEL_ID = \"1496267442899521627\"  # #zeus-admin-agent\nGUILD_ID\
      \ = \"1185714635991679006\"\n\nADMINISTRATOR = 0x8\nVIEW_CHANNEL = 0x400\n\n\
      token = os.environ.get(\"DISCORD_BOT_TOKEN\")\nheaders = {\n    \"Authorization\"\
      : f\"Bot {token}\",\n    \"Content-Type\": \"application/json\",\n    \"User-Agent\"\
      : \"Hermes-Agent (https://github.com/NousResearch/hermes-agent)\"\n}\n\ndef\
      \ http_get(url):\n    req = urllib.request.Request(url, headers=headers)\n \
      \   return json.loads(urllib.request.urlopen(req).read())\n\ndef http_put(url):\n\
      \    req = urllib.request.Request(url, method=\"PUT\", headers=headers, data=b\"\
      \")\n    return urllib.request.urlopen(req).read()\n\ndef http_patch(url, body):\n\
      \    req = urllib.request.Request(url, method=\"PATCH\", headers=headers, data=json.dumps(body).encode())\n\
      \    return urllib.request.urlopen(req).read()\n\n# 1. Renomear thread\ntry:\n\
      \    http_patch(f\"https://discord.com/api/v10/channels/{THREAD_ID}\", {\"name\"\
      : THREAD_NAME[:80]})\nexcept Exception as e:\n    print(f\"WARN rename: {e}\"\
      )\n\n# 2. Auto-discover membros que podem ver o canal pai\ntry:\n    roles =\
      \ http_get(f\"https://discord.com/api/v10/guilds/{GUILD_ID}/roles\")\n    role_perms\
      \ = {r['id']: int(r.get('permissions', 0)) for r in roles}\n    admin_roles\
      \ = {rid for rid, p in role_perms.items() if (p & ADMINISTRATOR) != 0}\n   \
      \ \n    parent = http_get(f\"https://discord.com/api/v10/channels/{PARENT_CHANNEL_ID}\"\
      )\n    allowed_roles = set(admin_roles)\n    denied_roles = set()\n    for po\
      \ in parent.get('permission_overwrites', []):\n        if po.get('type') ==\
      \ 0:\n            allow = int(po.get('allow', 0))\n            deny = int(po.get('deny',\
      \ 0))\n            if (allow & VIEW_CHANNEL) != 0:\n                allowed_roles.add(po['id'])\n\
      \            if (deny & VIEW_CHANNEL) != 0:\n                denied_roles.add(po['id'])\n\
      \    final_roles = allowed_roles - denied_roles\n    \n    members = http_get(f\"\
      https://discord.com/api/v10/guilds/{GUILD_ID}/members?limit=100\")\n    for\
      \ m in members:\n        user = m.get('user', {})\n        if user.get('bot'):\n\
      \            continue\n        member_roles = set(m.get('roles', []))\n    \
      \    if member_roles & final_roles:\n            try:\n                http_put(f\"\
      https://discord.com/api/v10/channels/{THREAD_ID}/thread-members/{user['id']}\"\
      )\n            except Exception:\n                pass\nexcept Exception as\
      \ e:\n    print(f\"WARN auto-discover: {e}\")\n\n### Resposta final no Discord\n\
      \nApos rename + adicao de membros, responder a tarefa do user normalmente, mas\
      \ SEMPRE comecando com `<@USER_ID>` (substituir USER_ID pelo ID do user que\
      \ enviou a mensagem).\n\nNAO mencionar nada sobre rename, membros adicionados\
      \ ou system messages na resposta. Foco apenas na tarefa.\n\nFormato esperado:\n\
      `<@344196393512075265> [resposta direta da tarefa]`\n\nUser IDs conhecidos:\n\
      - Rodolfo Mattei: 344196393512075265\n- Raquel Oliveira: 1496254952501280974\n\
      \nCRITICO: User-Agent header eh OBRIGATORIO no execute_code. Sem User-Agent,\
      \ Cloudflare bloqueia com erro 1010."
