    '1541578556037927053': 'INSTRUCAO ESPECIFICA — Eggbev-US-CC-EN Criar Campanhas


      - Esta thread trata exclusivamente de criacao do zero na conta Eggbev-US-CC-EN-01-G006
      (`act_1034081997659047`). Clonagem usa a thread `1543333373945053184`.

      - Gestao da operacao: Rodolfo e Nicolas. Budget write e outros gates sensiveis
      continuam sujeitos a matriz MGS; a existencia da thread, pre-stage ou plan nao
      autoriza publicacao Meta.

      - Antes de responder, carregar `chatpion-bot-campaign-operations`. Ela abre
      somente o prompt, o contrato desta rota e o runner necessário. Carregar `meta-campaign-engine-v3`
      apenas depois de fechar o intake e entrar na etapa de manifest/execução; não
      abrir a umbrella Eggbev nem os contratos completos por padrão.

      - Nesta thread, pedidos genericos como "sua configuracao", "como esta configurada"
      ou "relatorio da configuracao" significam a configuracao operacional da criacao
      Eggbev. Nao responder com modelo, provider, OAuth, ferramentas, flags de seguranca,
      versao Hermes ou configuracao global do Ares, salvo pedido explicitamente global.

      - A skill compartilhada define somente o mecanismo. Identidade, conta, valores,
      authority, runners e exceções vêm do contrato Eggbev e nunca são propagados
      a outro consumidor.

      - Mudança durável aprovada nesta rota atualiza esta thread funcional e a thread
      Regras pelo sincronizador canônico; mudança específica Eggbev não altera outros
      consumidores.

      - Para relatorio de configuracao, executar `scripts/ares-eggbev-creation-config-report.py
      --check`. Para intake read-only, usar `scripts/ares-eggbev-creation-intake-simulate.py`.
      Para preparar o request real, usar somente `scripts/ares-eggbev-creation.py`;
      ele materializa o manifest e delega todo write/readback ao Campaign Engine v3.

      - Nunca herdar configuracao de trafego direto, Credito para Veiculo ou snapshots
      historicos. Campos ativos das fontes canonicas vencem secoes historicas.

      - Nunca publicar diretamente. Fluxo: Page/readbacks → inputs → reconciliacao
      scoped → reserva → pre-stage → manifest prevalidado → plan → resumo final com
      digest → esperar OK explicito de Nicolas → conferir autoridade financeira vigente
      ou envelope pre-aprovado somente no execute → Engine v3 `--confirm-execute`
      → GET/readback consolidado. O gate financeiro nunca bloqueia intake, pre-stage,
      plan ou resumo.

      - Criacao normal aprovada nasce `ACTIVE` com `start_time` futuro, por padrao
      no dia seguinte as 00:00 em `America/New_York`. Aplique esse horario sem perguntar
      novamente quando o pedido nao trouxer override. Canario tecnico `PAUSED` e um
      modo separado, somente se pedido e aprovado. Excecao unica vigente: o primeiro
      request `eggbev-pg-5024-20260830-nicolas-01` atualiza o `start_time` no execute
      para o horario corrente ET com buffer tecnico minimo da Meta; nao propagar essa
      excecao para pedidos futuros.

      - Frases como "3 campanhas com 3 criativos" significam 3 campanhas x 1 ad set
      x 3 ads, com 9 criativos unicos no lote; nao reutilizar os mesmos 3 entre campanhas.
      "cc en us" normaliza para `CC_US_EN`.

      - Criativos de criacao normal sao sempre novos, reservados e reconciliados no
      Drive/Meta. Um pedido do gestor para puxar da pasta autoriza apenas a revisao/liberacao
      scoped do request. Nunca tornar o pool globalmente elegivel, selecionar por
      ordem de filename ou consumir/reservar assets antes do pedido real.

      - O modelo canonico default e `pg_5024_dup01_live_validated_v1`, derivado da
      campanha live validada `162 - Amy Shook - ENG - US - (pg_5024) C001 DUP01`.
      Ele padroniza configuracao, evento, copy, placements, identidade e readbacks;
      nunca copia a midia, os IDs ou o sufixo `DUP01` para criacao do zero.

      - O call natural `criar N campanha(s) pagina X` aplica automaticamente `1x1x3`,
      pasta `CC_US_EN`, tres criativos ineditos por campanha, o modelo canonico da
      DUP01, naming `[page_sequence] - [Page] - ENG - US - (pg_XXXXX) C0XX`, copy
      aprovada, JSON Messenger, tracking, placements manuais e nomes `AD NN - {canonical_stem}`.
      Em lote, a sequencia avanca C001, C002, C003...; `DUPnn` continua exclusivo
      de clone. Overrides explicitos vencem esses defaults.

      - Copy significa `Primary text`, `Headline`, `Description` e `CTA`; imagens
      e videos sao criativos. Cada ad recebe todas as tres headlines aprovadas: `APPLY
      NOW ✅`, `CARD APPROVED` e `✔️ APPLY CARD`; Primary text vazio, Description `⭐️⭐️⭐️⭐️⭐️`
      e CTA `APPLY_NOW`. A instrucao atual de Nicolas vence o modelo quando houver
      override explicito.

      - Todo novo ad set usa pixel `935354115143283` com `custom_event_type=OTHER`
      e `custom_event_str=eggbev-pv-u` (UI: Eggbev PV U). A identidade de Instagram
