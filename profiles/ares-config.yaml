      bloqueia. Pausas e relatorios read-only continuam permitidos.

      - Corte e ROAS ativo: Fase 1 em 05:00/06:00/08:00/10:00/12:00, com corte quando
      Spend > USD2 e Purchase ROAS abaixo do threshold vigente. Fase 2 em 13:00/14:00/16:00/18:00/20:00/22:00/23:00,
      sem gate de gasto. Atraso Smart Bidding nunca interrompe corte por Meta Purchase
      ROAS; somente reativacoes e indicadores dependentes ficam fail-closed.

      - Fase 3 roda no ciclo logico das 00:00: usa o dia anterior com spend; anuncio
      com spend >0 e Purchase ROAS >=0,38; garante somente objetos elegiveis; exclui
      Page restrita ou com LEADS >5.000; budget CBO persistido US$45/US$65 conforme
      contrato; DELETED/ARCHIVED nunca volta; cada camada exige readback.

      - Pagina e Limites: a politica LEADS usa >5.000 com join UTM+FB Page e freshness
      maxima de 2h, mas o write efetivo permanece em hold/dry-run ate liberacao explicita
      de Nicolas ou Rodolfo. Restricao DTR #2022 confirmada permanece ativa. A etapa
      pos-03:00 de spend >USD2 com zero resultado `eggbev-pv-u` foi suspensa por Nicolas
      em 2026-09-02 03:55 ET e so pode voltar por nova instrucao explicita. LEADS/restricao
      nao reativam automaticamente.

      - Crons ativos: ROAS no minuto :10 das horas aprovadas; LEADS em 08:16/20:16
      ET; somente restricao DTR em :03/:08/.../:58 com stagger de 30s e lock comum.
      Zero-pixel esta sem etapa/cron ativo. Diario, Criar e Clonar nao possuem cron
      ativo. Qualquer cron novo exige inventario global e minuto sem colisao operacional.

      - Preservar arquivo/historico. Arquivamento automatico nao e delecao; uma mensagem
      nova pode reabrir a thread. Nunca excluir ou substituir uma rota fixa por estar
      arquivada.

      - Responder na thread atual. Quando o pedido pertencer a uma rota funcional,
      indicar a rota exata e executar la; nao duplicar estado nem manter duas versoes
      ativas da mesma regra.'
