      Regras pelo sincronizador canônico; mudança específica Eggbev não altera outros
      consumidores.

      - Threshold diario de corte vigente 0,36. Fase 1: 05, 06, 08, 10 e 12 ET; todos
      esses ciclos cortam anuncio quando Spend > USD 2 e Purchase ROAS < threshold.
      Fase 2: 13, 14, 16, 18, 20, 22 e 23 ET; corta anuncio quando Purchase ROAS <
      threshold sem gate de gasto. Exatamente no threshold mantem.

      - O scheduler físico dispara no minuto `:10` de cada hora aprovada e o runner
      normaliza para a hora lógica `:00`; `:10` permanece dentro da janela fail-closed
      máxima de 15 minutos e evita o congestionamento do minuto `:00`.

      - Nos ciclos noturnos 20:00, 22:00 e 23:00, N/D/sem ROAS so entra em corte quando
      a campanha efetivamente rodou naquele dia ET. Campanha criada hoje com `start_time`
      para o dia seguinte as 00:00 e sempre excluida do corte noturno.

      - Purchase ROAS individual vazio com leitura Meta valida aparece `N/D` e segue
      a politica da fase; ausencia total da linha na Fase 2 tambem e `N/D` elegivel
      a corte. Atraso, staleness ou indisponibilidade da dashboard Smart Bidding nao
      bloqueia cortes das Fases 1/2: o corte usa o Purchase ROAS vivo da Meta e ocorre
      imediatamente abaixo do threshold vigente. Nessas condicoes, somente reativacoes
      e campos dependentes da Smart Bidding falham fechados com alerta/N/D. Falha
      da propria leitura Meta continua fail-closed porque nao existe metrica segura
      para decidir o corte.

      - Fases 1/2 continuam exclusivamente no anuncio: nunca pausar campanha/ad set.
      A Fase 3 das 00:00 e excecao explicita e separada: le o dia anterior fechado;
      exige spend do anuncio >0 e Purchase ROAS >=0,38; aceita pausas feitas pelo
      Ares, Nicolas ou outro operador; garante campanha, conjunto e anuncio ACTIVE;
      nunca restaura DELETED/ARCHIVED.

      - Na Fase 3, excluir a campanha somente quando a pagina tiver LEADS estritamente
      >5.000; exatamente 5.000 ainda e elegivel. Exigir match exato UTM+Page e freshness
      `/estimated/delay` com `totalMinutes` presente entre 0 e 120; `currentFillTime`
      e evidencia adicional quando nao nulo, mas o schema vivo pode retorna-lo nulo.
      Para cada campanha elegivel, randomizar budget CBO entre US$45 e US$65, persistir
      a escolha antes do primeiro write e reutiliza-la em qualquer retry. Ordem: budget+readback,
      campanha+readback, conjunto+readback, anuncio+readback.

      - Gate superior da Fase 3 e de qualquer reativação: consultar a denylist canônica
      de Pages antes do budget/status write. Page com histórico atual ou passado de
      restrição fica totalmente fora da reativação, mesmo com ROAS/LEADS elegíveis;
      não alterar budget e não ativar campanha, conjunto ou anúncios dessa Page.

      - Meta Purchase ROAS e a metrica de decisao. Metricas economicas Smart Bidding
      e formulas marcadas com `*` sao report-only e nao alteram corte, reativacao
      ou budget.

      - Escala separada: ROAS agregado da campanha > 0,50 recomenda +10%; igual ou
      abaixo mantem. Budget manual solicitado por Nicolas e autorizado; escala automatica
      permanece write=false ate Nicolas aprovar a politica automatica e o teto/envelope
      aplicavel.

      - Runtime: Fases 1/2 fazem status write somente de anuncio. Fase 3 pode ativar
      campanha/conjunto/anuncio e escrever budget US$45/US$65 sob a autorizacao Eggbev
      de Nicolas. Toda acao exige pre-read, plano idempotente e GET/readback; erro
      parcial inicia recovery readback-first.

      - Todo relatorio de Corte e ROAS, inclusive Fase 3, mostra no cabecalho `Atraso
      da dash` a partir de `/estimated/delay.totalMinutes`: abaixo de 60 minutos usar
      `Nmin`; a partir de 60 usar `Xh YYmin`; ausente/invalido usar `N/D`. Exibir
      junto o limite de 2h e se esta dentro, acima ou nao verificavel, no mesmo padrao
      visual da Intraday Creditoparaveiculo.

      - Correcao aprovada por Nicolas em 01/09/2026: o limite informativo de freshness
      de 2h nunca interrompe a medida de seguranca. Em todos os cronogramas ja aprovados,
      se o Purchase ROAS do anuncio estiver abaixo do threshold atual, cortar imediatamente.
      Cortes pela thread Corte e ROAS nunca param por atraso da dashboard; nenhuma
      mudanca de horario foi feita por esta correcao.

      - Sempre postar relatorio da Fase 3 nesta thread, deixando no titulo e no resumo
