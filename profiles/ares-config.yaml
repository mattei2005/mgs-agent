      ↓ | ROI real | ROI est. | Leads | RPS | CPM | CTR | Acao`. `Leads` e `RPS` sao
      obrigatorios e nunca podem ser removidos. Usar dois espacos entre colunas, divisor
      `─`, pontos medios `·` em `Camp` e nos slots de `Ads ↓`, uma campanha por linha
      e sem barras verticais.

      - `Ads ↓` ordena os anuncios do maior ROAS para o menor: `03·0,92✅` manter ligado,
      `01·0,35🛑` desligar, `02·0,56♻️` religar e `04·N/D⏸` ja desligado. Nunca mostrar
