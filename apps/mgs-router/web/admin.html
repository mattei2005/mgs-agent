<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MGS Router — Rotas</title><link rel="stylesheet" href="/assets/style.css"><script src="/assets/app.js" defer></script></head>
<body><header><div><div class="brand">MGS DIGITAL CORP</div><h1>MGS Router</h1></div><div class="account"><span id="username"></span><button id="logout" class="secondary">Sair</button></div></header><main class="workspace"><section class="intro"><h2>Rotas</h2><p>O link permanece. Você escolhe o destino.</p></section><div id="message" role="status" aria-live="polite"></div><section class="filters"><label>Site / domínio<select id="domain"><option value="">Todos os domínios</option></select></label><label>Pesquisar<input id="search" placeholder="Caminho ou destino" type="search"></label><button id="new">Nova rota</button></section><section class="editor" id="editor" hidden><h3 id="editor-title">Nova rota</h3><form id="route-form"><div class="fields"><label>Domínio do link<input id="host" placeholder="tarjeta.wantabrand.com" required></label><label>Caminho<input id="path" placeholder="/m0" required></label><label>URL de destino<input id="destination" type="url" placeholder="https://wantabrand.com/..." required></label></div><p class="hint">UTMs e demais parâmetros recebidos serão preservados. Domínio e caminho ficam fixos após o cadastro.</p><button type="submit" id="save">Salvar e aplicar</button><button type="button" id="cancel" class="secondary">Cancelar</button></form></section><section id="routes" aria-label="Lista de rotas"></section><p class="hint">Somente rotas e redirecionamento. Sem tracking ou relatórios.</p></main></body></html>
