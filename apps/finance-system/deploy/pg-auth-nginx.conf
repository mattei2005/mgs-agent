# Rodolfo authorization 1545934831664242748. Login is enforced by application for all data/assets.
# ACME remains served by RunCloud; other requests pass only to the permissioned Unix socket.
location ~ ^/(?!\.well-known/acme-challenge/) {
    proxy_pass http://unix:/run/mgs-finance-dash.sock:;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_cache off;
    proxy_hide_header X-Powered-By;
}
