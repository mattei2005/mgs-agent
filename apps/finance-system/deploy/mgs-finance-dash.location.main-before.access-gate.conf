# Authorization 1545928620462313645. Fail closed until application login is validated.
# Application data lives outside the webapp document root.
default_type text/plain;
add_header Cache-Control "no-store" always;
add_header Retry-After "3600" always;
if ($uri !~ "^/\.well-known/acme-challenge/") {
    return 503 "MGS Finance: ambiente em preparacao. Acesso financeiro ainda nao liberado.\n";
}
# Prepared private proxy. The server-level gate above must remain in place.
location ~ ^/(?!\.well-known/acme-challenge/) {
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_cache off;
}
